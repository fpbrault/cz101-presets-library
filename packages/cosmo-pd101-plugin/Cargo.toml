[package]
name = "cosmo-pd101-plugin"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Cosmo PD-101 synthesizer CLAP/VST3/AU plugin"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
doctest = false

[[bin]]
name = "cosmo-pd101-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
default = ["clap", "vst3", "au"]
clap = ["dep:truce-clap", "dep:clap-sys"]
vst3 = ["dep:truce-vst3"]
au = ["dep:truce-au"]
standalone = ["dep:truce-standalone"]
cargo-clippy = []
debug_gui = []
shell = ["truce/shell"]

[dependencies]
arc-swap = "1.7"
clap-sys = { version = "0.5", optional = true }
cosmo-synth-engine = { path = "../cosmo-synth-engine" }
cosmo-pd101-bridge-types = { path = "../cosmo-pd101-bridge-types" }
crossbeam-queue = "0.3"
include_dir = "0.7"
truce = { workspace = true }
truce-core = { workspace = true }
truce-params = { workspace = true }
truce-clap = { workspace = true, optional = true }
truce-vst3 = { workspace = true, optional = true }
truce-au = { workspace = true, optional = true }
truce-standalone = { workspace = true, features = ["gui"], optional = true }
wry = { workspace = true }
raw-window-handle = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
cfg-if = "1"
libm = "0.2"
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.27"
objc = "0.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSWindow", "NSView"] }
objc2-foundation = { version = "0.3", features = ["NSURL", "NSURLRequest", "NSString", "NSData", "NSDictionary", "NSRunLoop", "NSDate", "NSError", "NSGeometry", "NSThread"] }
objc2-web-kit = { version = "0.3", features = ["block2", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKSnapshotConfiguration"] }
block2 = "0.6"
dispatch2 = "0.3"

[build-dependencies]
serde_json = "1.0"

[dev-dependencies]
assert_no_alloc = "1"
truce-test = { workspace = true }
